<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <title>Inventory Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- ================= Navbar ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/products}">

            Inventory Management System

        </a>

        <div class="d-flex align-items-center">

            <span class="text-white me-3">

                <i class="bi bi-person-circle"></i>

                Welcome,

                <strong sec:authentication="name"></strong>

            </span>

            <form th:action="@{/logout}" method="post">

                <button class="btn btn-outline-light">

                    <i class="bi bi-box-arrow-right"></i>

                    Logout

                </button>

            </form>

        </div>

    </div>

</nav>

<!-- ================= Content ================= -->

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <div class="row">

                <div class="col-md-8">

                    <form th:action="@{/products}" method="get">

                        <div class="input-group">

                            <input
                                    type="text"
                                    class="form-control"
                                    name="keyword"
                                    placeholder="Search product..."
                                    th:value="${keyword}">

                            <button class="btn btn-light">

                                <i class="bi bi-search"></i>

                            </button>

                        </div>

                    </form>

                </div>

                <div class="col-md-4 text-end">

                    <a class="btn btn-success"
                       th:href="@{/products/new}">

                        <i class="bi bi-plus-circle"></i>

                        Add Product

                    </a>

                </div>

            </div>

        </div>

        <div class="card-body">

            <table class="table table-hover table-bordered">

                <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Price</th>

                    <th>Quantity</th>

                    <th width="170">Actions</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="p : ${products}">

                    <td th:text="${p.id}"></td>

                    <td th:text="${p.name}"></td>

                    <td th:text="${p.price}+' MAD'"></td>

                    <td th:text="${p.quantity}"></td>

                    <td>

                        <a class="btn btn-warning btn-sm"
                           th:href="@{/products/edit/{id}(id=${p.id})}">

                            <i class="bi bi-pencil"></i>

                        </a>

                        <a class="btn btn-danger btn-sm"

                           onclick="return confirm('Delete this product ?')"

                           th:href="@{/products/delete/{id}(id=${p.id},
                           page=${currentPage},
                           keyword=${keyword})}">

                            <i class="bi bi-trash"></i>

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

            <!-- Pagination -->

            <nav>

                <ul class="pagination justify-content-center">

                    <li class="page-item"

                        th:each="i:${#numbers.sequence(0,pages.length-1)}"

                        th:classappend="${i==currentPage}? ' active'">

                        <a class="page-link"

                           th:text="${i+1}"

                           th:href="@{/products(page=${i},
                           keyword=${keyword})}">

                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
