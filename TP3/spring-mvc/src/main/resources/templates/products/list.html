<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">

        <a class="navbar-brand fw-bold" th:href="@{/products}">
            📦 Inventory Management System
        </a>

        <a th:href="@{/products/new}" class="btn btn-success">
            <i class="bi bi-plus-circle"></i>
            Add Product
        </a>

    </div>
</nav>

<div class="container mt-4">

    <!-- Search -->

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <form method="get" th:action="@{/products}">

                <div class="row">

                    <div class="col-md-10">

                        <input
                                class="form-control"
                                type="text"
                                name="keyword"
                                th:value="${keyword}"
                                placeholder="Search product">

                    </div>

                    <div class="col-md-2">

                        <button class="btn btn-primary w-100">

                            <i class="bi bi-search"></i>

                            Search

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <!-- Table -->

    <div class="card shadow">

        <div class="card-header bg-dark text-white">

            <h4>Product List</h4>

        </div>

        <div class="card-body">

            <table class="table table-hover table-striped">

                <thead class="table-primary">

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Price</th>

                    <th>Quantity</th>

                    <th width="180">Actions</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="p : ${products}">

                    <td th:text="${p.id}"></td>

                    <td th:text="${p.name}"></td>

                    <td th:text="${#numbers.formatDecimal(p.price,1,2)}+' MAD'"></td>

                    <td th:text="${p.quantity}"></td>

                    <td>

                        <a class="btn btn-warning btn-sm"
                           th:href="@{/products/edit/{id}(id=${p.id})}">

                            <i class="bi bi-pencil"></i>

                        </a>

                        <a class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this product ?')"
                           th:href="@{/products/delete/{id}(id=${p.id},
                                page=${currentPage},
                                keyword=${keyword})}">

                            <i class="bi bi-trash"></i>

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

            <!-- Pagination -->

            <nav>

                <ul class="pagination justify-content-center">

                    <li
                            th:each="i : ${#numbers.sequence(0,pages.length-1)}"
                            th:class="${currentPage==i}?'page-item active':'page-item'">

                        <a class="page-link"

                           th:text="${i+1}"

                           th:href="@{/products(page=${i},
                           keyword=${keyword})}">

                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
